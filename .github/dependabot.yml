version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
